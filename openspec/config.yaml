schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Work is tracked in GitHub Issues for this repo. Use the `gh` CLI for all issue access.

rules:
  proposal:
    - 'If the change comes from a GitHub issue, read it first with `gh issue view <n> --comments`'
    - 'Put "Issue: #<n>" as the first line of proposal.md'
    - 'Name the change after the issue, e.g. `42-add-brightness-control`'
  tasks:
    - Do not duplicate tasks that already exist as checklist items in the issue; reference them

operations:
  apply:
    guidance:
      - When starting work, comment on the linked issue with `gh issue comment <n>` and the change name
  archive:
    guidance:
      - After archiving, close the linked issue with `gh issue close <n> --comment "Archived as <change-name>"`
